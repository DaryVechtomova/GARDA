<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Примірочна GARDA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Labrada:ital,wght@0,100..900;1,100..900&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        body {
            margin: 0;
            display: flex;
            overflow: hidden;
            /* Прибирає скрол для body, якщо #controls має свій */
            font-family: Arial, sans-serif;
            /* Базовий шрифт */
            background-color: #FFFFFD;
            /* Фон як у Cart.jsx */
        }

        #viewer {
            width: 70%;
            height: 100vh;
            /* background-color: #C1D6E4; Задається в main.js, тут можна не ставити */
        }

        #controls {
            width: 30%;
            min-width: 300px;
            /* Мінімальна ширина для контролів */
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            /* Tailwind p-5 -> 1.25rem -> 20px */
            box-sizing: border-box;
            overflow-y: auto;
            /* Дозволяє скрол, якщо вміст не вміщається */
            font-family: "Literata", serif;
            border-left: 1px solid #e5e7eb;
            /* Легка рамка зліва */
        }

        /* Заголовок контролів */
        #controls h2 {
            font-family: "Montserrat Alternates", sans-serif;
            /* Шрифт як у Cart.jsx */
            font-size: 1.5rem;
            /* Tailwind text-2xl */
            font-weight: 600;
            /* Tailwind font-semibold */
            text-align: center;
            margin-bottom: 1.25rem;
            /* Tailwind mb-5 */
            color: #1f2937;
            /* Темно-сірий */
        }

        /* Група для кожного контролу */
        #controls .group {
            margin-bottom: 1rem;
            /* Tailwind mb-4 */
        }

        #controls label {
            display: block;
            /* Кожен label на новому рядку */
            font-size: 1.3 rem;
            /* Tailwind text-sm */
            font-weight: 500;
            /* Tailwind font-medium */
            color: #010101;
            /* Tailwind text-gray-700 */
            margin-bottom: 0.25rem;
            /* Невеликий відступ під назвою параметра */
        }

        /* Стилі для input[type="number"] та input[type="range"] */
        /* Стилі для input[type="number"] та input[type="range"] */
        #controls input[type="number"],
        #controls input[type="range"] {
            width: 100%;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            box-sizing: border-box;
            margin-top: 0.25rem;
            outline: none;

            /* === ПОКАЗУЄМО СТАНДАРТНІ СТРІЛОЧКИ ДЛЯ ЧИСЛОВИХ ПОЛІВ === */
            -webkit-appearance: textfield !important;
            -moz-appearance: textfield !important;
            appearance: textfield !important;
            /* ======================================================= */
        }

        /* Окремо для input[type="range"], якщо для нього потрібен інший вигляд (без стрілок) */
        #controls input[type="range"] {
            -webkit-appearance: slider-horizontal;
            /* Або інше значення для повзунка */
            -moz-appearance: none;
            /* Firefox часто потребує none для кастомних повзунків */
            appearance: none;
            /* Або slider-horizontal, якщо підтримується */
            /* Тут можуть бути твої специфічні стилі для повзунка, якщо потрібно */
        }

        #controls input[type="number"]:focus,
        #controls input[type="range"]:focus {
            border-color: #3b82f6;
            /* Tailwind focus:border-blue-500 */
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
            /* Легкий фокусний ефект */
        }


        /* Текст з поточним значенням */
        #controls .current-value-text {
            /* Новий клас для стилізації */
            margin-top: 0.375rem;
            /* Tailwind mt-1.5 */
            font-size: 1.1 rem;
            /* Tailwind text-xs */
            color: #2e5c79;
            /* Tailwind text-gray-500 */
        }

        /* Кнопка */
        #controls button {
            width: 100%;
            background-color: #54A5D9;
            /* Колір як у Cart.jsx */
            color: white;
            font-weight: 500;
            /* Tailwind font-medium */
            font-size: 1rem;
            /* Tailwind text-base */
            padding-top: 0.75rem;
            /* Tailwind py-3 */
            padding-bottom: 0.75rem;
            border-radius: 0.5rem;
            /* Tailwind rounded-lg */
            margin-top: 1.5rem;
            /* Tailwind mt-6 */
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }

        #controls button:hover {
            background-color: #4389b9;
            /* Колір hover як у Cart.jsx */
        }
        #controls input[type="number"] {
    /* ... твої інші стилі ... */
    -webkit-appearance: textfield;
    -moz-appearance: textfield; /* Важливо для Firefox, хоча там стрілки можуть виглядати інакше */
    appearance: textfield;
}
    </style>
</head>

<body>
    <div id="viewer"></div>
    <div id="controls">
        <h2>Параметри тіла (см)</h2>
        <div class="group">
            <label for="armLengthInput">Довжина руки:</label>
            <input type="number" id="armLengthInput" min="45" max="80" step="1" value="56">
            <span class="current-value-text">Поточне: <span id="armLengthValue">56</span> см</span>
        </div>
        <div class="group">
            <label for="armWidthInput">Ширина руки (обхват):</label>
            <input type="number" id="armWidthInput" min="20" max="50" step="1" value="26">
            <span class="current-value-text">Поточне: <span id="armWidthValue">26</span> см</span>
        </div>
        <div class="group">
            <label for="neckWidthInput">Ширина шиї (обхват):</label>
            <input type="number" id="neckWidthInput" min="25" max="45" step="1" value="34">
            <span class="current-value-text">Поточне: <span id="neckWidthValue">34</span> см</span>
        </div>
        <div class="group">
            <label for="neckToWaistLengthInput">Довжина від шиї до талії:</label>
            <input type="number" id="neckToWaistLengthInput" min="25" max="50" step="1" value="33">
            <span class="current-value-text">Поточне: <span id="neckToWaistLengthValue">33</span> см</span>
        </div>
        <div class="group">
            <label for="waistWidthInput">Обхват талії:</label>
            <input type="number" id="waistWidthInput" min="50" max="110" step="1" value="74">
            <span class="current-value-text">Поточне: <span id="waistWidthValue">74</span> см</span>
        </div>
        <div class="group">
            <label for="chestWidthInput">Обхват грудей:</label>
            <input type="number" id="chestWidthInput" min="50" max="120" step="1" value="85">
            <span class="current-value-text">Поточне: <span id="chestWidthValue">85</span> см</span>
        </div>
        <div class="group">
            <label for="hipsWidthInput">Обхват стегон:</label>
            <input type="number" id="hipsWidthInput" min="70" max="140" step="1" value="100">
            <span class="current-value-text">Поточне: <span id="hipsWidthValue">104</span> см</span>
        </div>
        <div class="group">
            <label for="thighWidthInput">Ширина стегна (обхват):</label>
            <input type="number" id="thighWidthInput" min="40" max="90" step="1" value="59">
            <span class="current-value-text">Поточне: <span id="thighWidthValue">59</span> см</span>
        </div>
        <div class="group">
            <label for="calfWidthInput">Ширина гомілки (обхват):</label>
            <input type="number" id="calfWidthInput" min="20" max="50" step="1" value="37">
            <span class="current-value-text">Поточне: <span id="calfWidthValue">37</span> см</span>
        </div>
        <div class="group">
            <label for="waistToCrotchLengthInput">Довжина від талії до паху:</label>
            <input type="number" id="waistToCrotchLengthInput" min="25" max="40" step="1" value="33">
            <span class="current-value-text">Поточне: <span id="waistToCrotchLengthValue">33</span> см</span>
        </div>
        <div class="group">
            <label for="thighLengthInput">Довжина стегна:</label>
            <input type="number" id="thighLengthInput" min="20" max="60" step="1" value="27">
            <span class="current-value-text">Поточне: <span id="thighLengthValue">27</span> см</span>
        </div>
        <div class="group">
            <label for="calfLengthInput">Довжина гомілки:</label>
            <input type="number" id="calfLengthInput" min="30" max="70" step="1" value="45">
            <span class="current-value-text">Поточне: <span id="calfLengthValue">45</span> см</span>
        </div>
        <div class="group">
            <label for="cheeksWidthInput">Повнота щік:</label>
            <input type="range" id="cheeksWidthInput" min="0" max="1" step="0.01" value="0.5">
            <span class="current-value-text">Поточне: <span id="cheeksWidthValue">0.5</span></span>
        </div>
        <div class="group">
            <button id="dressButton">Одягнути вишиванку</button>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
